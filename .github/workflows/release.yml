name: Publish Windows release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: false

# Jobs only read the repository by default. The publishing job below grants
# contents: write explicitly and only for the GitHub Release operation.
permissions:
  contents: read

jobs:
  preflight:
    name: Validate version and release state
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.release-state.outputs.publish }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag, package version and main ancestry
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          tag_version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not valid SemVer: $version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $tag does not match package.json version $version" >&2
            exit 1
          fi

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "The tagged commit must already be reachable from origin/main." >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Stop safely when the release already exists
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no artifact will be overwritten."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality gates
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run release-focused regression tests
        run: >-
          node --import ./tests/test-env.mjs
          --experimental-strip-types
          --experimental-loader ./tests/ts-loader.mjs
          --test
          tests/electron-host-process.test.ts
          tests/local-bootstrap-migrations.test.ts
          tests/mesa-start-combat-local.test.ts

  package-windows:
    name: Build Windows update artifacts
    needs: [preflight, quality]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installers
        shell: pwsh
        run: .\scripts\windows\build-installer.ps1

      - name: Verify electron-updater metadata
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: pwsh
        run: |
          $output = "installer\windows\electron-output"
          $installers = @(Get-ChildItem (Join-Path $output "*Setup*.exe") -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $metadataPath = Join-Path $output "latest.yml"
          if (-not (Test-Path $metadataPath)) { throw "electron-builder did not create latest.yml." }
          $metadata = Get-Content $metadataPath -Raw
          if ($metadata -notmatch "(?m)^version:\s*$([regex]::Escape($env:VERSION))\s*$") { throw "latest.yml does not describe version $($env:VERSION)." }
           # electron-builder may serialize spaces and other filename characters
           # URL-encoded in latest.yml. Validate the decoded metadata instead of
           # comparing only the literal text.
           $decodedMetadata = [System.Uri]::UnescapeDataString($metadata)
           if ($decodedMetadata -notmatch [regex]::Escape($installers[0].Name)) { throw "latest.yml does not reference the generated NSIS installer." }
          $blockmaps = @(Get-ChildItem (Join-Path $output "*.blockmap") -File -ErrorAction SilentlyContinue)
          if ($blockmaps.Count -lt 1) { throw "electron-builder did not create a .blockmap artifact." }
          Write-Host "NSIS: $($installers[0].Name)"
          Write-Host "Metadata: latest.yml"
          Write-Host "Blockmaps: $($blockmaps.Count)"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            installer/windows/electron-output/*Setup*.exe
            installer/windows/electron-output/latest.yml
            installer/windows/electron-output/*.blockmap

  publish:
    name: Publish GitHub Release
    needs: [preflight, quality, package-windows]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets-${{ needs.preflight.outputs.version }}
          path: release-assets

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release-assets/*Setup*.exe)
          blockmaps=(release-assets/*.blockmap)
          [[ ${#installers[@]} -eq 1 ]] || { echo "Expected one NSIS installer." >&2; exit 1; }
          [[ -f release-assets/latest.yml ]] || { echo "latest.yml is missing." >&2; exit 1; }
          [[ ${#blockmaps[@]} -ge 1 ]] || { echo ".blockmap is missing." >&2; exit 1; }

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # gh release create fails if another process created the release after
          # preflight; it never replaces existing assets.
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "Cyberpunk RED Calculator $VERSION" \
            --generate-notes
