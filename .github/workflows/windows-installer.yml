name: Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "installer/windows/**"
      - "scripts/windows/**"
      - "scripts/local-start.mjs"
      - "scripts/migrate-local.mjs"
      - "scripts/backup-local.mjs"
      - "scripts/restore-local.mjs"
      - "scripts/postgres-binaries.mjs"
      - "supabase/migrations/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and compile installer
        shell: pwsh
        run: .\scripts\windows\build-installer.ps1

      - name: Check artifact contents
        shell: pwsh
        run: |
          $required = @(
            "installer\windows\stage\app\scripts\start-host.mjs",
            "installer\windows\stage\app\scripts\migrate-local.mjs",
            "installer\windows\stage\app\scripts\backup-local.mjs",
            "installer\windows\stage\app\scripts\restore-local.mjs",
            "installer\windows\stage\app\scripts\postgres-binaries.mjs",
            "installer\windows\stage\app\desktop\main.cjs",
            "installer\windows\stage\app\node_modules\next\dist\bin\next",
            "installer\windows\stage\app\node_modules\electron\dist\electron.exe",
            "installer\windows\stage\app\favicon.ico",
            "installer\windows\stage\node",
            "installer\windows\stage\postgres"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Required installer payload is missing: $path" } }
          foreach ($name in @("node.exe", "pg_dump.exe", "pg_restore.exe", "initdb.exe", "pg_ctl.exe")) {
            $base = if ($name -eq "node.exe") { "installer\windows\stage\node" } else { "installer\windows\stage\postgres" }
            if (-not (Get-ChildItem $base -Filter $name -Recurse -File | Select-Object -First 1)) { throw "Required bundled executable is missing: $name" }
          }
          $artifact = "installer\windows\output\CyberpunkRedCalculator-Setup.exe"
          if (-not (Test-Path $artifact)) { throw "Installer artifact was not created: $artifact" }
          $size = (Get-Item $artifact).Length
          if ($size -lt 1MB) { throw "Installer artifact is unexpectedly small: $size bytes" }
          Write-Host "Created $artifact ($size bytes)"
           $electronOutput = "installer\windows\electron-output"
           if (-not (Test-Path $electronOutput -PathType Container)) { throw "Electron Builder output directory is missing: $electronOutput. The build step should have failed earlier with the original error." }
           $electronArtifacts = @(Get-ChildItem (Join-Path $electronOutput "*Setup*.exe") -File -ErrorAction Stop)
           if ($electronArtifacts.Count -ne 1) { throw "Expected exactly one Electron NSIS installer in $electronOutput, found $($electronArtifacts.Count)." }
           $electronArtifact = $electronArtifacts[0]
           if ($electronArtifact.Length -lt 1MB) { throw "Electron artifact is unexpectedly small: $($electronArtifact.Length) bytes" }
           if (-not (Test-Path (Join-Path $electronOutput "latest.yml"))) { throw "Electron updater metadata latest.yml is missing." }
           if (@(Get-ChildItem (Join-Path $electronOutput "*.blockmap") -File -ErrorAction SilentlyContinue).Count -lt 1) { throw "Electron updater .blockmap is missing." }
           Write-Host "Created $($electronArtifact.FullName) ($($electronArtifact.Length) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
         name: CyberpunkRedCalculator-Windows-${{ github.sha }}
         path: |
           installer/windows/output/CyberpunkRedCalculator-Setup.exe
           installer/windows/electron-output/*Setup*.exe
           installer/windows/electron-output/latest.yml
           installer/windows/electron-output/*.blockmap
         if-no-files-found: error
